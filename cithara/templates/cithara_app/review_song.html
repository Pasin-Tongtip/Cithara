<!DOCTYPE html>
<html lang="en">
<head>
    <title>Review Your Song</title>
    <style>
        body { background-color: #fff1b1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding: 40px; }
        .review-box { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #474f5b; margin-top: 0; text-align: center;}
        .detail-row { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .label { font-weight: bold; color: #6c757d; font-size: 14px; text-transform: uppercase; }
        .value { font-size: 18px; color: #474f5b; margin-top: 4px; }
        
        .btn-container { display: flex; gap: 15px; margin-top: 30px; }
        
        .submit-btn, .back-btn { 
            flex: 1; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .submit-btn { 
            background-color: #edd269; 
            color: #474f5b; 
        }
        .submit-btn:hover { 
            background-color: #d4a017; 
        }
        
        .back-btn { 
            background-color: #f8f9fa; 
            color: #474f5b; 
            border: 1px solid #ced4da; 
        }
        .back-btn:hover { 
            background-color: #e2e6ea; 
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #edd269;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="review-box">
        <h1>Review Details</h1>
        
        <div class="detail-row"><div class="label">Title</div><div class="value">{{ song.title }}</div></div>
        <div class="detail-row"><div class="label">Occasion</div><div class="value">{{ song.occasion }}</div></div>
        <div class="detail-row"><div class="label">Genre</div><div class="value">{{ song.genre }}</div></div>
        <div class="detail-row"><div class="label">Voice Type</div><div class="value">{{ song.voice_type }}</div></div>
        <div class="detail-row"><div class="label">Mood</div><div class="value">{{ song.mood }}</div></div>
        <div class="detail-row" style="border:none;"><div class="label">Prompt Details</div><div class="value">{{ song.story }}</div></div>

        {% csrf_token %}
        
        <div class="btn-container" id="action-buttons">
            <a href="{% url 'create_song' %}" class="back-btn">Go Back</a>
            <button type="button" class="submit-btn" onclick="startGeneration('{% url 'generate_song_api' song.id %}', '{% url 'check_suno_status' song.id %}')">Confirm & Generate</button>
        </div>

        <div id="loading-spinner" style="display: none; margin-top: 30px; text-align: center;">
            <p style="color: #474f5b; font-weight: bold; line-height: 1.5;">🤖 AI is composing your masterpiece...<br>This usually takes 1-3 minutes.</p>
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        function startGeneration(generateUrl, statusUrl) {
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    
            document.getElementById('action-buttons').style.display = 'none';
            document.getElementById('loading-spinner').style.display = 'block';
    
            fetch(generateUrl, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    checkStatus(statusUrl);
                } else {
                    alert('Error starting generation: ' + data.message);
                    resetButton();
                }
            })
            .catch(err => {
                console.error(err);
                alert('Something went wrong contacting the server.');
                resetButton();
            });
        }
    
        function checkStatus(statusUrl) {
            fetch(statusUrl)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'completed') {
                    window.location.href = "{% url 'library' %}";
                } else if (data.status === 'generating') {
                    setTimeout(() => checkStatus(statusUrl), 5000);
                } else {
                    alert('Error checking status: ' + data.message);
                    resetButton();
                }
            })
            .catch(err => {
                console.error(err);
                setTimeout(() => checkStatus(statusUrl), 5000);
            });
        }
    
        function resetButton() {
            document.getElementById('action-buttons').style.display = 'flex';
            document.getElementById('loading-spinner').style.display = 'none';
        }
    </script>
</body>
</html>
